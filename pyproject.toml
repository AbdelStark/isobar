[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "isobar-sim"
version = "0.1.0"
description = "An inspectable simulation laboratory for AI governance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
isobar = "isobar.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/isobar"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "isobar/static"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/web/src", "/web/public", "/web/tests",
           "/web/index.html", "/web/package.json", "/web/package-lock.json",
           "/web/tsconfig.json", "/web/vite.config.ts", "/web/playwright.config.ts",
           "/README.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Makefile",
           "/pyproject.toml", "/uv.lock", "/.python-version", "/.github/workflows",
           "/AGENTS.md", "/.agents/skills", "/scripts"]

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
